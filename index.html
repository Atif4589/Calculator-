<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 0%, #14142b 0%, #060611 55%, #040408 100%);
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
}

.app {
  width: 100%;
  max-width: 420px;
}

/* ---------- Header ---------- */

.app-header {
  text-align: center;
  margin-bottom: 28px;
}

.app-header h1 {
  font-size: 34px;
  font-weight: 700;
  color: #f2f2f7;
  letter-spacing: 0.2px;
}

.grad-text {
  background: linear-gradient(90deg, #b957f0, #7b7bf5);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  margin-top: 6px;
  color: #8b8b9e;
  font-size: 15px;
  letter-spacing: 0.5px;
}

.underline {
  width: 60px;
  height: 3px;
  margin: 14px auto 0;
  border-radius: 2px;
  background: linear-gradient(90deg, #b957f0, #4d8dff);
}

/* ---------- Display ---------- */

.display {
  position: relative;
  border-radius: 40px;
  padding: 28px 30px 26px;
  margin-bottom: 26px;
  background: #10101c;
  border: 2px solid transparent;
  background-image:
    linear-gradient(#10101c, #10101c),
    linear-gradient(90deg, #4d8dff, #c04df0 55%, #ff5fae);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  box-shadow:
    0 0 18px rgba(120, 90, 255, 0.35),
    0 0 40px rgba(255, 80, 180, 0.15),
    inset 0 0 30px rgba(0, 0, 0, 0.4);
}

.display-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 20px;
}

.history {
  color: #9a9aad;
  font-size: 17px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mode {
  color: #7d7d8e;
  font-size: 13px;
  letter-spacing: 1px;
  font-weight: 600;
}

.result {
  margin-top: 18px;
  text-align: right;
  color: #ffffff;
  font-size: 56px;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

.result::-webkit-scrollbar {
  display: none;
}

/* ---------- Keypad ---------- */

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.key {
  border: none;
  border-radius: 24px;
  height: 74px;
  font-size: 26px;
  font-weight: 500;
  color: #f0f0f5;
  cursor: pointer;
  background: #181826;
  box-shadow:
    0 4px 10px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
}

.key:active {
  transform: scale(0.95);
  filter: brightness(1.15);
}

.key-num {
  background: linear-gradient(160deg, #1d1d2c, #14141f);
}

.key-func {
  background: linear-gradient(160deg, #1d1d2c, #14141f);
  font-size: 20px;
}

.key-ac {
  color: #ff5c5c;
}

.key-op {
  background: linear-gradient(160deg, #4b0aa7, #4a1f8f);
  box-shadow:
    0 4px 14px rgba(123, 63, 214, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.key-equals {
  background: linear-gradient(160deg, #ff9a3d, #fd4466);
  box-shadow:
    0 4px 16px rgba(255, 90, 100, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
  font-size: 30px;
  border-radius: 24px;
}

.key-zero {
  grid-column: span 1;
}

/* ---------- Responsive ---------- */

@media (max-width: 380px) {
  .result {
    font-size: 44px;
  }
  .key {
    height: 64px;
    font-size: 22px;
  }
  .app-header h1 {
    font-size: 28px;
  }
}

</style>
</head>
<body>

  <div class="app">

    <header class="app-header">
      <h1><span class="grad-text">Modern</span> Calculator</h1>
      <p class="subtitle">Sleek. Simple. Smart.</p>
      <div class="underline"></div>
    </header>

    <div class="display">
      <div class="display-top">
        <span id="history" class="history"></span>
        <span class="mode">DEG</span>
      </div>
      <div id="result" class="result">0</div>
    </div>

    <div class="keys">
      <button class="key key-func key-ac" data-action="clear">AC</button>
      <button class="key key-func" data-action="parens">( )</button>
      <button class="key key-func" data-action="percent">%</button>
      <button class="key key-func" data-action="backspace">⌫</button>

      <button class="key key-num" data-value="7">7</button>
      <button class="key key-num" data-value="8">8</button>
      <button class="key key-num" data-value="9">9</button>
      <button class="key key-op" data-value="/">÷</button>

      <button class="key key-num" data-value="4">4</button>
      <button class="key key-num" data-value="5">5</button>
      <button class="key key-num" data-value="6">6</button>
      <button class="key key-op" data-value="*">×</button>

      <button class="key key-num" data-value="1">1</button>
      <button class="key key-num" data-value="2">2</button>
      <button class="key key-num" data-value="3">3</button>
      <button class="key key-op" data-value="-">−</button>

      <button class="key key-num key-zero" data-value="0">0</button>
      <button class="key key-num" data-value=".">.</button>
      <button class="key key-op" data-value="+">+</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>

  </div>

<script>
// ---------- State ----------
let expression = '';   // raw expression using real operators (* /)
let justEvaluated = false;

const historyEl = document.getElementById('history');
const resultEl = document.getElementById('result');

// ---------- Helpers ----------

// Turn the raw expression into the pretty version shown in the small history line
function prettify(str) {
  return str
    .replace(/\*/g, '×')
    .replace(/\//g, '÷');
}

// Safely evaluate a math expression (only numbers, + - * / % . ( ))
function safeEvaluate(str) {
  if (!str) return '';

  // Reject anything that isn't a digit, operator, dot, percent, paren or space
  if (!/^[0-9+\-*/.%() ]*$/.test(str)) return null;

  // Turn "%" into "/100" so 50% => 0.5
  const parsed = str.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

  try {
    // eslint-disable-next-line no-new-func
    const value = Function(`"use strict"; return (${parsed})`)();
    if (value === undefined || value === null || !isFinite(value)) return null;
    return value;
  } catch (err) {
    return null;
  }
}

function formatNumber(num) {
  if (typeof num !== 'number') return num;
  // Avoid ugly floating point tails, but keep reasonable precision
  const rounded = Math.round(num * 1e10) / 1e10;
  return rounded.toString();
}

function updateDisplay() {
  historyEl.textContent = prettify(expression);

  if (expression === '') {
    resultEl.textContent = '0';
    return;
  }

  const liveValue = safeEvaluate(expression);
  resultEl.textContent = liveValue === null ? prettify(expression) : formatNumber(liveValue);
}

// ---------- Actions ----------

function inputValue(val) {
  // If we just evaluated and the user starts typing a number, start fresh
  if (justEvaluated) {
    expression = /[0-9.]/.test(val) ? '' : expression; // keep result if continuing with an operator
    justEvaluated = false;
  }
  expression += val;
  updateDisplay();
}

function clearAll() {
  expression = '';
  justEvaluated = false;
  updateDisplay();
}

function backspace() {
  if (justEvaluated) {
    clearAll();
    return;
  }
  expression = expression.slice(0, -1);
  updateDisplay();
}

function togglePercent() {
  inputValue('%');
}

function insertParens() {
  const openCount = (expression.match(/\(/g) || []).length;
  const closeCount = (expression.match(/\)/g) || []).length;

  if (expression === '' || /[+\-*/(%]$/.test(expression)) {
    expression += '(';
  } else if (openCount > closeCount) {
    expression += ')';
  } else {
    expression += '(';
  }
  updateDisplay();
}

function equals() {
  if (expression === '') return;

  const value = safeEvaluate(expression);
  if (value === null) {
    resultEl.textContent = 'Error';
    return;
  }

  // Requirement: clear the history line once an operation (=) is performed
  historyEl.textContent = '';
  resultEl.textContent = formatNumber(value);

  expression = formatNumber(value).toString();
  justEvaluated = true;
}

// ---------- Event wiring ----------

document.querySelectorAll('.key').forEach((btn) => {
  btn.addEventListener('click', () => {
    const { action, value } = btn.dataset;

    if (action === 'clear') return clearAll();
    if (action === 'backspace') return backspace();
    if (action === 'percent') return togglePercent();
    if (action === 'parens') return insertParens();
    if (action === 'equals') return equals();

    if (value !== undefined) inputValue(value);
  });
});

// ---------- Keyboard support ----------

document.addEventListener('keydown', (e) => {
  const { key } = e;

  if (/^[0-9.+\-*/%()]$/.test(key)) {
    inputValue(key);
    return;
  }
  if (key === 'Enter' || key === '=') {
    e.preventDefault();
    equals();
    return;
  }
  if (key === 'Backspace') {
    backspace();
    return;
  }
  if (key === 'Escape') {
    clearAll();
  }
});

updateDisplay();

</script>
</body>
</html>
